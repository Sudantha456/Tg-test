name: Telegram Compressor Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install System Dependencies & Python Packages
      run: |
        sudo apt update
        sudo apt install -y ffmpeg python3-pip curl
        pip3 install aiogram aiohttp

    # 1. Cloud Server එකෙන් Bot එක අනිවාර්යයෙන්ම Log out කිරීම
    - name: Log out from Telegram Cloud
      run: |
        curl -s "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/logOut" || true
        sleep 2

    # 2. Local Server එක (TELEGRAM_LOCAL="1" සමඟ) ආරම්භ කිරීම
    - name: Start Telegram Bot API Server
      run: |
        mkdir -p /tmp/telegram-bot-api-data
        chmod 777 /tmp/telegram-bot-api-data
        docker run -d \
          --name tg-bot-api \
          -p 8081:8081 \
          -v /tmp/telegram-bot-api-data:/var/lib/telegram-bot-api \
          -e TELEGRAM_API_ID="${{ secrets.API_ID }}" \
          -e TELEGRAM_API_HASH="${{ secrets.API_HASH }}" \
          -e TELEGRAM_LOCAL="1" \
          aiogram/telegram-bot-api:latest

    - name: Verify Local Bot Server Connection
      run: |
        sleep 5
        docker logs tg-bot-api
        curl -s http://127.0.0.1:8081 || exit 1

    - name: Run Aiogram Bot
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      run: |
        python3 bot.py
