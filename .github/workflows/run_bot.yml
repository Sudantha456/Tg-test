name: Telegram Compressor Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # C build tools සහ Python packages ස්ථාපනය
    - name: Install System Dependencies & Python Packages
      run: |
        sudo apt update
        sudo apt install -y python3-pip build-essential libssl-dev ffmpeg
        pip3 install pyrogram tgcrypto

    # Pyrogram Bot එක ධාවනය කිරීම
    - name: Run Pyrogram Bot
      env:
        API_ID: ${{ secrets.API_ID }}
        API_HASH: ${{ secrets.API_HASH }}
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      run: |
        python3 bot.py
