name: Telegram Compressor Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # පැය 6කට වරක් ස්වයංක්‍රීයව නැවත පණ ගැන්වීමට (GitHub Action 6h limit)
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 1. අවශ්‍ය මෘදුකාංග සහ Python Packages (aiogram v3) ස්ථාපනය කිරීම
    - name: Install System Dependencies & Python Packages
      run: |
        sudo apt update
        sudo apt install -y ffmpeg python3-pip curl
        pip3 install aiogram aiohttp

    # 2. Local Bot API Server එක Docker මඟින් Background Run කිරීම (--local mode)
    - name: Start Telegram Bot API Server
      run: |
        docker run -d \
          --name tg-bot-api \
          -p 8081:8081 \
          -v /tmp/telegram-bot-api-data:/var/lib/telegram-bot-api \
          -e TELEGRAM_API_ID=${{ secrets.API_ID }} \
          -e TELEGRAM_API_HASH=${{ secrets.API_HASH }} \
          aiogram/telegram-bot-api:latest \
          --local \
          --http-port=8081 \
          --dir=/var/lib/telegram-bot-api

    # 3. Local Server එක සක්‍රීයදැයි පරීක්ෂා කිරීම (404 ලැබුණද Connection එක සාර්ථක ලෙස සැලකේ)
    - name: Verify Local Bot Server Connection
      run: |
        sleep 5
        curl -s http://127.0.0.1:8081 || exit 1

    # 4. Aiogram Bot එක ධාවනය කිරීම
    - name: Run Aiogram Bot
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      run: |
        python3 bot.py
