name: Telegram Compressor Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # පැය 6කට වරක් ස්වයංක්‍රීයව නැවත පණ ගැන්වීමට (GitHub Action 6h limit)
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 1. අවශ්‍ය මෘදුකාංග (FFmpeg) සහ Python Packages ස්ථාපනය කිරීම
    - name: Install System Dependencies & Python Packages
      run: |
        sudo apt update
        sudo apt install -y ffmpeg python3-pip
        pip3 install pyrogram tgcrypto

    # 2. Official Docker Container එක හරහා Local Bot API Server එක Background Run කිරීම
    - name: Start Telegram Bot API Server
      run: |
        docker run -d \
          --name tg-bot-api \
          -p 8081:8081 \
          -v /tmp/telegram-bot-api-data:/var/lib/telegram-bot-api \
          -e TELEGRAM_API_ID=${{ secrets.API_ID }} \
          -e TELEGRAM_API_HASH=${{ secrets.API_HASH }} \
          aiogram/telegram-bot-api:latest \
          --local \
          --http-port=8081 \
          --dir=/var/lib/telegram-bot-api

    # 3. Local Server එක සාර්ථකව Ready වනතුරු තත්පර 5ක් ලබා දී Connection එක තහවුරු කරගැනීම
    - name: Verify Local Bot Server Connection
      run: |
        sleep 5
        curl -s http://127.0.0.1:8081 || exit 1

    # 4. Pyrogram Bot එක ධාවනය කිරීම
    - name: Run Pyrogram Bot
      env:
        API_ID: ${{ secrets.API_ID }}
        API_HASH: ${{ secrets.API_HASH }}
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      run: |
        python3 bot.py
